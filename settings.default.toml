
# PSXRecomp Runtime User Settings
[general]
language            = "en"

[video]
fullscreen          = 1
aspect_ratio        = "16:9"
renderer            = "opengl"
internal_resolution = "1080p"
supersampling       = 2
geometry_correction = true
smooth_motion       = false
perspective_texturing = true
antialiasing        = true
auto_skip_fmv       = false
fast_doors          = true
vsync               = "on"
low_latency_input   = true
aspect_stretch      = true

[audio]
spu_hq = false

[controller]
p1_device           = "auto"
modern_controls     = false
modern_turn_speed   = 90
directinput_joysticks = false
rumble_intensity    = 1.0
hotkey_pad_fast_forward = 1528
hotkey_pad_save_state_menu = 2040
hotkey_pad_rewind = 1272

[cheats]
infinite_health       = false
infinite_ammo         = false
infinite_ink_ribbons  = false
